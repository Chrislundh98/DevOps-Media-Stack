services:
  phd-monitor:
    build: .
    container_name: phd-monitor
    restart: unless-stopped
    volumes:
      # Persist state across container restarts
      - ./state:/app/state
    environment:
      # Optionally override webhook URL
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK}
      
      # Timezone for logging
      - TZ=Europe/Stockholm
    # Resource limits - very lightweight
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'