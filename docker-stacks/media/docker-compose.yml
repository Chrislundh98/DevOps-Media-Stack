# Media stack — the *arr suite routed through gluetun's VPN, plus
# Jellyfin/Jellyseerr for playback and Tdarr/MakeMKV/mkvtoolnix for
# transcoding and remuxing. Resource limits prevent any one container
# from monopolising CPU or memory.

networks:
  shared_network:
    name: shared_network
    external: true

services:
  # Single VPN tunnel that *arr + qbittorrent share via network_mode.
  # Everything downloads through this container's interface; if gluetun
  # dies, the rest can't reach the internet (kill-switch by design).
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    env_file: ./.env
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Ports for containers that share gluetun's network namespace.
      - "8080:8080"   # qBittorrent
      - "7878:7878"   # Radarr
      - "8989:8989"   # Sonarr
      - "9696:9696"   # Prowlarr
      - "6767:6767"   # Bazarr
      - "7474:7474"   # autobrr
      - "8191:8191"   # flaresolverr
      - "2468:2468"   # unpackerr
      - "41487:41487/tcp"
      - "41487:41487/udp"
    volumes:
      - ${APPDATA}/gluetun:/gluetun
      - ${APPDATA}/gluetun/wg0.conf:/gluetun/wireguard/wg0.conf
    environment:
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      - DNS_ADDRESS=1.1.1.1
      - FIREWALL_VPN_INPUT_PORTS=41487
      # Allow LAN + WireGuard subnet + provider endpoint outside the tunnel.
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET},10.13.13.0/24,${VPN_ENDPOINT_CIDR}
      - UPDATER_PERIOD=24h
      - LOG_LEVEL=info
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - shared_network

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/radarr:/config
      - ${MEDIA_ROOT}:/storage
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    network_mode: service:gluetun
    depends_on:
      - gluetun
    deploy:
      resources:
        limits:
          memory: '4G'
        reservations:
          memory: '256M'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7878/ping"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 40s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${MEDIA_ROOT}:/storage
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    network_mode: service:gluetun
    depends_on:
      - gluetun
    deploy:
      resources:
        limits:
          memory: '2G'
        reservations:
          memory: '256M'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8989/ping"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 40s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/prowlarr:/config
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    network_mode: service:gluetun
    depends_on:
      - gluetun

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - LOG_LEVEL=info
      - CAPTCHA_SOLVER=none
      - NO_SANDBOX=true
    volumes:
      - /dev/shm:/dev/shm
    cap_add:
      - SYS_ADMIN
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    network_mode: service:gluetun
    depends_on:
      - gluetun

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:qbittorrent
      - TP_THEME=dark
    volumes:
      - ${APPDATA}/qbittorrent:/config
      # NVMe scratch space for in-progress torrents — moved to spinning
      # disk by *arr post-import.
      - ${SCRATCH_NVME}:/nvme_ssd
      - ${MEDIA_ROOT}:/storage
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    # Slightly bias OOM killer toward qbit if memory gets tight.
    oom_score_adj: 500
    network_mode: service:gluetun
    depends_on:
      - gluetun
    # qBittorrent was running unconstrained and using >17 GiB. Cap it,
    # lower cpu_shares so it yields to Jellyfin / Ollama under contention.
    cpu_shares: 256
    mem_limit: "6g"
    mem_reservation: "1g"

  autobrr:
    image: ghcr.io/autobrr/autobrr:latest
    container_name: autobrr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/autobrr:/config
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    network_mode: service:gluetun
    depends_on:
      - gluetun

  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr
    restart: unless-stopped
    ports:
      - "8265:8265"
      - "8266:8266"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - serverIP=0.0.0.0
    volumes:
      - ${APPDATA}/tdarr:/app/server
      - ${APPDATA}/tdarr/configs:/app/configs
      - ${APPDATA}/tdarr/logs:/app/logs
      - ${MEDIA_ROOT}/movies:/media/movies
      - ${MEDIA_ROOT}/series:/media/series
      - ${MEDIA_ROOT}/concerts:/media/concerts
      - ${MEDIA_ROOT}/yoga:/media/yoga
      - ${TDARR_CACHE}:/temp
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - shared_network
    # Transcoding is heavy but background — pin to E-cores so it doesn't
    # fight Jellyfin or Ollama for P-core time. Mem cap because ffmpeg
    # transient buffers can balloon.
    cpuset: "12-19"
    cpu_shares: 256
    mem_limit: "4g"

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ${APPDATA}/bazarr:/config
      - ${MEDIA_ROOT}:/storage
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    network_mode: service:gluetun
    depends_on:
      - gluetun
    deploy:
      resources:
        limits:
          memory: '2G'

  makemkv:
    image: ghcr.io/jlesage/makemkv:latest
    container_name: makemkv
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - '5800:5800'
    volumes:
      - ${APPDATA}/makemkv:/config
      - ${MEDIA_ROOT}/movies:/storage:ro
      - ${MEDIA_ROOT}/../data/remuxed:/output
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - shared_network
    cpuset: "12-19"
    cpu_shares: 256
    mem_limit: "2g"

  mkvtoolnix:
    image: ghcr.io/jlesage/mkvtoolnix:latest
    container_name: mkvtoolnix
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    ports:
      - '5801:5800'
    volumes:
      - ${APPDATA}/mkvtoolnix:/config
      - ${DATA_ROOT}:/data
      - ${MEDIA_ROOT}:/media
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - shared_network
    cpuset: "12-19"
    cpu_shares: 256
    mem_limit: "2g"

  unpackerr:
    image: ghcr.io/unpackerr/unpackerr:latest
    container_name: unpackerr
    restart: unless-stopped
    env_file: ./.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - UN_MASK=002
      - UN_SONARR_0_URL=http://gluetun:8989
      - UN_RADARR_0_URL=http://gluetun:7878
      - UN_SONARR_0_API_KEY=${UN_SONARR_0_API_KEY}
      - UN_RADARR_0_API_KEY=${UN_RADARR_0_API_KEY}
    volumes:
      - ${DATA_ROOT}/downloads:/downloads
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - shared_network
    depends_on:
      - sonarr
      - radarr
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: '1G'

  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "1000:1000"
    group_add:
      - "992"   # render (for VAAPI)
      - "44"    # video
    restart: unless-stopped
    ports:
      - 8096:8096/tcp
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - LC_ALL=en_US.UTF-8
      - LANG=en_US.UTF-8
    volumes:
      - ${APPDATA}/jellyfin:/config
      - ${APPDATA}/jellyfin/cache:/cache
      - ${MEDIA_ROOT}/series:/media/series
      - ${MEDIA_ROOT}/movies:/media/movies
      - ${MEDIA_ROOT}/concerts:/media/concerts
      - ${MEDIA_ROOT}/yoga:/media/yoga
    devices:
      - /dev/dri:/dev/dri
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      shared_network:
        # Pinned IP so NPM can reverse-proxy by address.
        ipv4_address: 172.18.0.15
    # User-facing: gets scheduler priority over background jobs. Allowed
    # on all CPUs because hardware transcoding still benefits from spare
    # P-core cycles. Mem cap so transcoding spikes can't OOM the host.
    cpu_shares: 2048
    mem_limit: "8g"
    mem_reservation: "1g"

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: jellyseerr
    restart: unless-stopped
    ports:
      - 5056:5055
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PUID=1000
      - PGID=1000
    volumes:
      - ${APPDATA}/jellyseerr:/app/config
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - shared_network
