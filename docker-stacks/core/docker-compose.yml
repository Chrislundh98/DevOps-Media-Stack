# Core stack — reverse proxy, VPN gateway, monitoring, container updates.
# Shares an external network with the media stack so containers from both
# stacks can resolve each other by name.

networks:
  shared_network:
    name: shared_network
    external: true

services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginxproxymanager
    restart: unless-stopped
    ports:
      - '8081:80'
      - '8443:443'
      - '81:81'
    volumes:
      - ${APPDATA}/nginxproxymanager/data:/data
      - ${APPDATA}/nginxproxymanager/letsencrypt:/etc/letsencrypt
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      shared_network:
        # Pinned IP — Jellyfin reverse-proxies through this address.
        ipv4_address: 172.18.0.12

  # General-purpose WireGuard tunnel for clients (phones, laptops).
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - '51820:51820/udp'
    volumes:
      - ${APPDATA}/wireguard:/config
      - /lib/modules:/lib/modules
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=${PUBLIC_IP}
      - PEERS=8
      - INTERNAL_SUBNET=10.13.13.0/24
    labels:
      # Pinned: excluded from watchtower so a bad image push can't break
      # remote access while the host is unattended. Update manually.
      - "com.centurylinklabs.watchtower.enable=false"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  # Separate admin tunnel — full-tunnel, smaller peer set, isolated subnet.
  wireguard-admin:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: wireguard-admin
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      - '51821:51820/udp'
    volumes:
      - ${APPDATA}/wireguard-admin:/config
      - /lib/modules:/lib/modules
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - SERVERURL=${PUBLIC_IP}
      - SERVERPORT=51821
      - PEERS=3
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.14.14.0/24
      - ALLOWEDIPS=0.0.0.0/0
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - shared_network

  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/host:ro
    environment:
      - GLANCES_OPT=-w
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  wizarr:
    image: ghcr.io/wizarrrr/wizarr:latest
    container_name: wizarr
    restart: unless-stopped
    ports:
      - "5690:5690"
    volumes:
      - ${APPDATA}/wizarr:/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
      - DISABLE_BUILTIN_AUTH=false
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - shared_network

  jellystat:
    image: cyfershepard/jellystat:latest
    container_name: jellystat
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${JS_DB_USER}
      - POSTGRES_PASSWORD=${JS_DB_PASSWORD}
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${JS_DB_NAME}
      - JWT_SECRET=${JS_JWT_SECRET}
      - TZ=${TZ}
      - JF_USE_WEBSOCKETS=false
    ports:
      - "${JS_PORT}:3000"
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    networks:
      - shared_network
    depends_on:
      - jellystat-db

  jellystat-db:
    image: postgres:15-alpine
    container_name: jellystat-db
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${JS_DB_USER}
      - POSTGRES_PASSWORD=${JS_DB_PASSWORD}
      - POSTGRES_DB=${JS_DB_NAME}
    volumes:
      - ${APPDATA}/jellystat/db:/var/lib/postgresql/data
    networks:
      - shared_network
    labels:
      # Pinned: Postgres major-version bumps are not safe to auto-apply.
      - "com.centurylinklabs.watchtower.enable=false"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=${TZ}
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=false
      # Only updates containers that opted in via label — see compose files.
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATION_URL=${DISCORD_WATCHTOWER}
      - WATCHTOWER_NOTIFICATION_REPORT=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
